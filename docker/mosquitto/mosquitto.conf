# LOCAL DEVELOPMENT BROKER ONLY.
# Anonymous, unencrypted access is acceptable on a private compose network but must never be
# exposed. In AWS the broker is IoT Core with X.509 mutual TLS and per-device policies.

listener 1883
allow_anonymous true

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
