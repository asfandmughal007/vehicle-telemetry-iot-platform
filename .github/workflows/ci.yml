name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

# A newer push to the same branch makes the older run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            infra/cdk/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff)
        run: ruff format --check .
      - name: Type check (mypy, strict)
        run: >
          mypy packages/telemetry-common/src services/simulator/src services/edge_gateway/src
          cloud/lambdas/telemetry_processor/src services/api/src
          infra/cdk/vehicle_telemetry_cdk infra/cdk/app.py infra/cdk/scripts

  test:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            infra/cdk/requirements.txt
      # The CDK tests synthesize templates and need Node.js (jsii runtime).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
          retention-days: 14

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --check dashboard/app.js
      - run: node --test dashboard/tests/lib.test.mjs

  docker:
    name: Build image (${{ matrix.image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: simulator
            dockerfile: services/simulator/Dockerfile
          - image: edge-gateway
            dockerfile: services/edge_gateway/Dockerfile
          - image: local-ingestor
            dockerfile: cloud/lambdas/telemetry_processor/Dockerfile
          - image: api
            dockerfile: services/api/Dockerfile
          - image: dashboard
            dockerfile: dashboard/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (not pushed)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          tags: vehicle-telemetry/${{ matrix.image }}:ci
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet

  cdk-synth:
    name: CDK synth
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/cdk/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install CDK
        run: |
          pip install -r infra/cdk/requirements.txt
          npm install --global aws-cdk@2
      - name: Build Lambda bundles (linux/arm64 wheels)
        working-directory: infra/cdk
        run: python scripts/build_lambdas.py
      - name: Synthesize the stack
        working-directory: infra/cdk
        env:
          # Synthesis needs no credentials: an account/region placeholder is enough.
          CDK_DEFAULT_ACCOUNT: "123456789012"
          CDK_DEFAULT_REGION: eu-central-1
        run: cdk synth -c environment=dev --quiet
      - name: Upload CloudFormation template
        uses: actions/upload-artifact@v7
        with:
          name: cloudformation-template
          path: infra/cdk/cdk.out/*.template.json
          retention-days: 14
