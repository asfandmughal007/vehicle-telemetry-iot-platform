[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "telemetry-processor"
version = "0.1.0"
description = "Lambda that validates, transforms and stores vehicle telemetry in DynamoDB."
requires-python = ">=3.11"
dependencies = [
    "telemetry-common",
    # boto3 is part of the Lambda runtime; it is listed so local runs and tests have it.
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
# Only the local development bridge (MQTT -> same handler) needs an MQTT client.
local = ["paho-mqtt>=2.1,<3"]

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_processor"]
