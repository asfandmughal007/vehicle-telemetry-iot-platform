server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    # Scripts only from this origin; the page may call the API on any http(s) origin
    # (tighten connect-src to the real API URL in production).
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' http: https:; style-src 'self'; img-src 'self' data:" always;

    location = /config.js {
        add_header Cache-Control "no-store";   # deploy-time configuration, never cached
    }
    location / {
        try_files $uri $uri/ =404;
    }
}
