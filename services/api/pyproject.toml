[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "telemetry-api"
version = "0.1.0"
description = "Read API for vehicle telemetry (FastAPI), backed by DynamoDB."
requires-python = ">=3.11"
dependencies = [
    "telemetry-common",
    "fastapi>=0.115,<1",
    "pydantic-settings>=2.2,<3",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
# Container image: ASGI server.
server = ["uvicorn>=0.30,<1"]
# AWS Lambda behind API Gateway: ASGI -> Lambda adapter.
lambda = ["mangum>=0.19,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/telemetry_api"]
