[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "edge-gateway"
version = "0.1.0"
description = "Edge gateway / TCU: decodes CAN frames and forwards telemetry over MQTT with store-and-forward."
requires-python = ">=3.11"
dependencies = [
    "telemetry-common[can]",
    "python-can>=4.3,<5",
    "paho-mqtt>=2.1,<3",
    "pydantic-settings>=2.2,<3",
]

[project.scripts]
edge-gateway = "edge_gateway.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/edge_gateway"]
